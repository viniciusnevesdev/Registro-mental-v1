<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Registro Mental · Editor de ícones</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#17171b;--card2:#202027;--text:#f7f7fa;--muted:#a1a1aa;--line:rgba(255,255,255,.11);--accent:#7b68ee;--ok:#35c98a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:calc(14px + env(safe-area-inset-top)) 12px calc(110px + env(safe-area-inset-bottom))}
main{width:min(100%,720px);margin:auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}.head h1{font-size:23px;line-height:1.1;margin:0}.head p{font-size:12px;line-height:1.4;color:var(--muted);margin:6px 0 0}.version{flex:0 0 auto;border:1px solid var(--line);background:var(--card);padding:7px 9px;border-radius:999px;font-size:10px;font-weight:800;color:#d7d2ff}
.summary{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:15px;background:var(--card)}.summary span{font-size:11px;color:var(--muted)}.summary strong{font-size:12px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{border:1px solid var(--line);border-radius:19px;background:var(--card);padding:12px}.top{display:grid;grid-template-columns:58px minmax(0,1fr);gap:11px;align-items:center}.preview{width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--line);border-radius:16px;background:var(--card2);color:#fff}.preview svg{width:34px;height:34px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}.meta{min-width:0}.meta strong{display:block;font-size:14px}.meta small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.state{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;background:rgba(123,104,238,.15);color:#cfc8ff;font-size:9px;font-weight:800}.state.custom{background:rgba(53,201,138,.14);color:#93f0c7}
textarea{width:100%;height:92px;margin-top:10px;resize:vertical;border:1px solid var(--line);border-radius:13px;background:#0f0f13;color:#f7f7fa;padding:10px;font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}textarea:focus{border-color:rgba(123,104,238,.7);box-shadow:0 0 0 3px rgba(123,104,238,.12)}
.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;margin-top:8px}.actions button,.bottom button,.back{border:0;border-radius:12px;padding:10px 8px;font-size:10.5px;font-weight:800}.actions button{background:var(--card2);color:var(--text);border:1px solid var(--line)}.actions .save{background:var(--accent);border-color:transparent}.actions .reset{color:#ffb0b6}
.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:9px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(9,9,11,.92);border-top:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.bottom-inner{width:min(100%,720px);margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button,.back{background:var(--card2);color:var(--text);border:1px solid var(--line)}.bottom .primary{background:var(--accent);border-color:transparent}.toast{position:fixed;z-index:50;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#292930;color:white;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:11px;transition:.17s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}.card{min-width:0}}
</style>
</head>
<body>
<main>
  <div class="head"><div><h1>Editor de ícones</h1><p>Todos os ícones internos editáveis da Beta em uma única tela. Cole um SVG, confira a prévia e aplique somente no ícone desejado.</p></div><span class="version">1.2.0-beta.18</span></div>
  <div class="summary"><span>Ícones disponíveis</span><strong id="count"></strong></div>
  <section class="grid" id="grid"></section>
</main>
<div class="bottom"><div class="bottom-inner"><button id="backBtn">Voltar para a Beta</button><button class="primary" id="reloadBtn">Recarregar ícones</button></div></div>
<div class="toast" id="toast"></div>
<script>
const RELEASE='1.2.0-beta.18';
const SETTINGS_KEY='registro-beta-settings-v1';
const BASE_ICONS={"home":"\u003cpath d=\"M3 11.5 12 4l9 7.5\">\u003c/path>\u003cpath d=\"M5.5 10.5V20h13v-9.5\">\u003c/path>\u003cpath d=\"M9.5 20v-6h5v6\">\u003c/path>","history":"\u003cpath d=\"M3.5 12a8.5 8.5 0 1 0 2.5-6\">\u003c/path>\u003cpath d=\"M3.5 5v5h5\">\u003c/path>\u003cpath d=\"M12 7.5V12l3 2\">\u003c/path>","chart":"\u003cpath d=\"M4 19V10\">\u003c/path>\u003cpath d=\"M10 19V5\">\u003c/path>\u003cpath d=\"M16 19v-7\">\u003c/path>\u003cpath d=\"M22 19V8\">\u003c/path>","settings":"\u003ccircle cx=\"12\" cy=\"12\" r=\"3\">\u003c/circle>\u003cpath d=\"M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1a1.7 1.7 0 0 0-.4-1.1 1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 3.8 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2V9.6h.1A1.7 1.7 0 0 0 3.2 9a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.26 3.2l.06.06A1.7 1.7 0 0 0 8.2 3.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2h4v.1a1.7 1.7 0 0 0 .4 1.1 1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 8c.1.4.3.75.6 1 .3.25.7.4 1.1.4h.1v4h-.1c-.4 0-.8.15-1.1.4-.3.25-.5.6-.6 1.2Z\">\u003c/path>","note":"\u003cpath d=\"M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z\">\u003c/path>\u003cpath d=\"m13.5 6.5 4 4\">\u003c/path>","pill":"\u003cpath d=\"M8 18.5 18.5 8a4.24 4.24 0 0 0-6-6L2 12.5a4.24 4.24 0 1 0 6 6Z\">\u003c/path>\u003cpath d=\"m8.5 6.5 9 9\">\u003c/path>","moon":"\u003cpath d=\"M20 15.3A8 8 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z\">\u003c/path>","bag":"\u003cpath d=\"M5.5 8h13l-1 12h-11l-1-12Z\">\u003c/path>\u003cpath d=\"M9 8V6a3 3 0 0 1 6 0v2\">\u003c/path>","spark":"\u003cpath d=\"m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4L12 3Z\">\u003c/path>\u003cpath d=\"m19 14 .8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14Z\">\u003c/path>","link":"\u003cpath d=\"M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1\">\u003c/path>\u003cpath d=\"M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1\">\u003c/path>","heart":"\u003cpath d=\"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z\">\u003c/path>","export":"\u003cpath d=\"M12 3v12\">\u003c/path>\u003cpath d=\"m7 8 5-5 5 5\">\u003c/path>\u003cpath d=\"M5 13v7h14v-7\">\u003c/path>","import":"\u003cpath d=\"M12 15V3\">\u003c/path>\u003cpath d=\"m7 10 5 5 5-5\">\u003c/path>\u003cpath d=\"M5 13v7h14v-7\">\u003c/path>","plus":"\u003cpath d=\"M12 5v14M5 12h14\">\u003c/path>","edit":"\u003cpath d=\"M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z\">\u003c/path>","clock":"\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"M12 7v5l3 2\">\u003c/path>"};
const LABELS={"home":"Início","history":"Histórico","chart":"Análises","settings":"Ajustes","note":"Anotação","pill":"Medicamento","moon":"Sono","bag":"Compra","spark":"Aprendizado","link":"Link","heart":"Saúde","export":"Exportar","import":"Importar","plus":"Adicionar","edit":"Editar","clock":"Horário"};
const ORDER=['home','history','chart','spark','settings','note','pill','moon','bag','heart','clock','plus','edit','link','export','import'];
const dirty=new Set();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function settings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return{}}}
function writeSettings(s){localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}
function sanitize(raw=''){let s=String(raw).trim();s=s.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi,'').replace(/\son\w+\s*=\s*(['"]).*?\1/gi,'').replace(/\s(?:href|xlink:href)\s*=\s*(['"])(?:https?:|data:|javascript:).*?\1/gi,'');const m=s.match(/<svg[^>]*>([\s\S]*?)<\/svg>/i);return m?m[1]:s}
function effective(key,s=settings()){const o=s.iconOverrides?.[key];if(o?.type==='svg'&&o.value)return sanitize(o.value);if(o?.type==='bank'&&BASE_ICONS[o.value])return BASE_ICONS[o.value];return BASE_ICONS[key]||''}
function fullSvg(body){return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'+body+'</svg>'}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1300)}
async function pasteInto(key){const ta=document.querySelector('[data-svg="'+key+'"]');try{const t=await navigator.clipboard.readText();if(!t)throw 0;ta.value=t;ta.dispatchEvent(new Event('input',{bubbles:true}));toast('SVG colado')}catch{ta.focus();toast('Cole o SVG no campo')}}
function preview(key,raw){const box=document.querySelector('[data-preview="'+key+'"]');const body=raw.trim()?sanitize(raw):effective(key);box.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+body+'</svg>'}
function saveOne(key){const ta=document.querySelector('[data-svg="'+key+'"]');const raw=ta.value.trim(),s=settings();s.iconOverrides={...(s.iconOverrides||{})};if(raw){const clean=sanitize(raw);if(!clean)return toast('SVG vazio ou inválido');s.iconOverrides[key]={type:'svg',value:raw}}else delete s.iconOverrides[key];writeSettings(s);dirty.delete(key);render();toast('Ícone '+(LABELS[key]||key)+' aplicado')}
function resetOne(key){const s=settings();s.iconOverrides={...(s.iconOverrides||{})};delete s.iconOverrides[key];writeSettings(s);dirty.delete(key);render();toast('Ícone restaurado')}
function copyCurrent(key){const body=effective(key);const text=fullSvg(body);navigator.clipboard?.writeText(text).then(()=>toast('SVG atual copiado')).catch(()=>toast('Não foi possível copiar'))}
function render(){const s=settings(),grid=document.getElementById('grid');grid.innerHTML=ORDER.filter(k=>BASE_ICONS[k]).map(key=>{const o=s.iconOverrides?.[key],custom=!!o;const body=effective(key,s);const value=o?.type==='svg'?o.value:'';return '<article class="card"><div class="top"><div class="preview" data-preview="'+key+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+body+'</svg></div><div class="meta"><strong>'+esc(LABELS[key]||key)+'</strong><small>'+esc(key)+'</small><span class="state '+(custom?'custom':'')+'">'+(custom?'PERSONALIZADO':'PADRÃO DO APP')+'</span></div></div><textarea data-svg="'+key+'" spellcheck="false" placeholder="Cole aqui o novo código SVG para '+esc(LABELS[key]||key)+'">'+esc(value)+'</textarea><div class="actions"><button data-copy="'+key+'">Copiar atual</button><button class="reset" data-reset="'+key+'">Restaurar</button><button class="save" data-save="'+key+'">Aplicar SVG</button></div></article>'}).join('');document.getElementById('count').textContent=ORDER.filter(k=>BASE_ICONS[k]).length+' ícones';document.querySelectorAll('[data-svg]').forEach(ta=>ta.oninput=()=>{dirty.add(ta.dataset.svg);preview(ta.dataset.svg,ta.value)});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyCurrent(b.dataset.copy));document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetOne(b.dataset.reset));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveOne(b.dataset.save))}
document.getElementById('backBtn').onclick=()=>location.href='./';
document.getElementById('reloadBtn').onclick=()=>{render();toast('Ícones recarregados')};
window.addEventListener('beforeunload',e=>{if(!dirty.size)return;e.preventDefault();e.returnValue=''});
render();
</script>
</body>
</html>
