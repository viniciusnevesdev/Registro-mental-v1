name: Validar site público do Registro Mental

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "registro-mental-validacao-main"
  cancel-in-progress: true

jobs:
  validate-public-site:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a versão publicada
        uses: actions/checkout@v4

      - name: Validar arquivos, versões e isolamento dos dados
        run: |
          test -s index.html
          test -s app.js
          test -s boot.js
          test -s patches.js
          test -s menu.html
          test -s menu/index.html
          test -s diagnostico/index.html
          test -s beta/index.html
          test -s beta/app.js
          test -s beta/boot.js
          test -s beta/patches.js
          test -s beta/manifest.webmanifest
          python3 - <<'PY'
          import json
          from pathlib import Path

          environments = json.loads(Path('ambientes.json').read_text(encoding='utf-8'))
          official = json.loads(Path('environment.json').read_text(encoding='utf-8'))
          beta = json.loads(Path('beta/environment.json').read_text(encoding='utf-8'))
          official_manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          beta_manifest = json.loads(Path('beta/manifest.webmanifest').read_text(encoding='utf-8'))

          import re

          official_release = official['release']
          beta_release = beta['release']
          assert environments['official']['release'] == official_release
          assert environments['beta']['release'] == beta_release
          assert beta['baseline_official'] == official_release
          assert environments['official']['database'] == 'registro-mental-v1'
          assert environments['beta']['database'] == 'registro-mental-beta-v1'
          assert official_manifest['id'] == official_manifest['scope'] == './'
          assert beta_manifest['id'] == beta_manifest['scope'] == './'
          assert official_release in official_manifest['start_url']
          assert beta_release in beta_manifest['start_url']

          official_boot = Path('boot.js').read_text(encoding='utf-8')
          beta_boot = Path('beta/boot.js').read_text(encoding='utf-8')
          official_index = Path('index.html').read_text(encoding='utf-8')
          beta_index = Path('beta/index.html').read_text(encoding='utf-8')
          assert re.search(r"const RELEASE = ['\"]" + re.escape(official_release) + r"['\"]", official_boot)
          assert re.search(r"const RELEASE = ['\"]" + re.escape(beta_release) + r"['\"]", beta_boot)
          assert official_release in official_index
          assert beta_release in beta_index
          PY

      - name: Validar JavaScript, módulos incorporados e boot
        run: |
          find . -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          for (const [file, database] of [
            ['app.js', 'registro-mental-v1'],
            ['beta/app.js', 'registro-mental-beta-v1']
          ]) {
            const source = fs.readFileSync(file, 'utf8');
            const modules = [...source.matchAll(/s\.text=("(?:[^"\\]|\\.)*");document\.head\.appendChild/g)];
            if (modules.length !== 34) throw new Error(`${file}: esperava 34 módulos; encontrou ${modules.length}.`);
            modules.forEach((match, index) => new vm.Script(JSON.parse(match[1]), { filename: `${file}#${index + 1}` }));
            if (!/const VERSION = ['"][^'"]+['"];/.test(source)) throw new Error(`${file}: versão-base ausente.`);
            if (!source.includes(`const DB_NAME='${database}'`)) throw new Error(`${file}: banco local divergente.`);
            if (/\.src=['"]\.\/v04c(?:28|29|30|31|32|33|34|35)\.js/.test(source)) {
              throw new Error(`${file}: ainda tenta baixar módulos que já estão incorporados.`);
            }
            if (!source.includes('while(!db&&attempts<200)')) throw new Error(`${file}: migração emocional não aguarda o banco local.`);
            if (source.includes("'&quot'")) throw new Error(`${file}: escape HTML de aspas está incompleto.`);
            const decoded = modules.map(match => JSON.parse(match[1]));
            if (decoded.some(module => module.includes('delete record.hasAudio'))) {
              throw new Error(`${file}: editar anotação voltou a apagar áudio existente.`);
            }
          }

          const mood = fs.readFileSync('mood-bar-v2.js', 'utf8');
          if (/new MutationObserver\([\s\S]{0,220}paintRelease\(\)/.test(mood)) {
            throw new Error('mood-bar-v2.js: ciclo de MutationObserver voltou a ser possível.');
          }
          if (!mood.includes('if (stamp.textContent !== css)')) throw new Error('mood-bar-v2.js: pintura de release não é idempotente.');
          if (/id=["']accentControl["']/.test(fs.readFileSync('index.html', 'utf8'))) {
            throw new Error('index.html: seletor antigo de cor principal voltou à interface.');
          }
          if (!fs.readFileSync('official-appearance.js', 'utf8').includes("['accent','palette'")) {
            throw new Error('official-appearance.js: preferências antigas de cor não são limpas.');
          }

          for (const file of ['boot.js', 'beta/boot.js']) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes("withTimeout(navigator.clipboard.writeText(payload), 1200")) {
              throw new Error(`${file}: copiar diagnóstico pode bloquear indefinidamente.`);
            }
            if (!source.includes('appLooksFunctional()')) throw new Error(`${file}: boot não verifica a interface.`);
          }
          NODE

      - name: Validar links e impedir resíduos conhecidos
        run: |
          if rg -n '8w2jh948cw-sudo|Registro-mental-pwa|1\.2\.0-beta\.(12|13)|1\.1\.100' . --glob '!.github/**'; then
            echo 'Foi encontrado um endereço ou release obsoleto.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      if key in attrs:
                          self.values.append(attrs[key])

          root = Path('.').resolve()
          missing = []
          for html in root.rglob('*.html'):
              parser = Links()
              parser.feed(html.read_text(encoding='utf-8'))
              for raw in parser.values:
                  parsed = urlsplit(raw)
                  if parsed.scheme or parsed.netloc or not parsed.path or parsed.path.startswith(('#', 'data:')):
                      continue
                  target = (html.parent / parsed.path).resolve()
                  if target.is_dir():
                      target = target / 'index.html'
                  if not target.exists():
                      missing.append(f'{html.relative_to(root)} -> {raw}')
          if missing:
              raise SystemExit('Links internos ausentes:\n' + '\n'.join(missing))
          PY
