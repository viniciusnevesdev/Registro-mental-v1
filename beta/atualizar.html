<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#000000"><title>Mente Beta — atualizar</title><style>html,body{margin:0;min-height:100%;background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}main{width:min(100%,360px);text-align:center}.mark{font-size:28px;color:#c9bfff}.status{color:#aeaeb2;font-size:14px;line-height:1.45}</style></head><body><main><div class="mark">✦</div><h1>Atualizando Beta</h1><p class="status" id="status">Limpando a versão anterior…</p></main><script>(()=>{const RELEASE="1.2.0-beta.43",status=document.getElementById("status");(async()=>{try{if("serviceWorker"in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.allSettled(regs.filter(r=>String(r.scope||"").includes("/Registro-mental-v1/beta/")).map(r=>r.unregister()))}if("caches"in window){const keys=await caches.keys();await Promise.allSettled(keys.filter(k=>k.startsWith("registro-beta-v1-")).map(k=>caches.delete(k)))}}catch(_){}status.textContent="Abrindo a versão "+RELEASE+"…";location.replace("./?v="+encodeURIComponent(RELEASE)+"&fresh="+Date.now())})()})();</script></body></html>
