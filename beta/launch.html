<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Registro</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f5f7;color:#111114;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(100%,360px);text-align:center}
    .mark{width:54px;height:54px;margin:0 auto 15px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.07);font-size:25px}
    h1{font-size:24px;line-height:1.15;margin:0 0 8px}.status{font-size:14px;color:#6e6e73;line-height:1.45;margin:0}
    .bar{height:5px;background:#dedee3;border-radius:999px;overflow:hidden;margin:18px 36px}.bar span{display:block;width:35%;height:100%;background:#7d5cff;border-radius:inherit;animation:move 1s ease-in-out infinite alternate}
    @keyframes move{to{transform:translateX(185%)}}
    @media(prefers-color-scheme:dark){html,body{background:#111114;color:#f7f7f8}.mark{background:#1c1c1e}.status{color:#a1a1a6}.bar{background:#2c2c2e}}
  </style>

  <!-- rm-environment-icon -->
  <link rel="icon" href="./icon-beta.jpeg?v=20260911" type="image/jpeg">
  <link rel="apple-touch-icon" href="./icon-beta.jpeg?v=20260911">
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✦</div>
  <h1>Registro</h1>
  <p class="status" id="status">Preparando uma abertura limpa…</p>
  <div class="bar"><span></span></div>
</main>
<script>
(() => {
  const RELEASE='1.2.0-beta.45';
  const status=document.getElementById('status');
  const cleanupKey=`registro-beta-v1-launch-clean-${RELEASE}`;
  async function clean(){
    let needsClean=true;
    try{needsClean=localStorage.getItem(cleanupKey)!=='1'}catch(_){}
    if(!needsClean)return;
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.allSettled(regs.filter(r=>String(r.scope||'').includes('/Registro-mental-v1/beta/')).map(r=>r.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.allSettled(keys.filter(k=>k.startsWith('registro-beta-v1-')).map(k=>caches.delete(k)));
      }
      try{localStorage.setItem(cleanupKey,'1')}catch(_){}
    }catch(_){}
  }
  (async()=>{
    await clean();
    status.textContent='Abrindo a interface…';
    const url=`./?v=${encodeURIComponent(RELEASE)}&launch=${Date.now()}`;
    setTimeout(()=>location.replace(url),90);
  })();
})();
</script>
</body>
</html>
