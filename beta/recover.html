<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Recuperar Registro</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f5f7;color:#111114;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
    main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    section{width:min(100%,390px);background:#fff;border-radius:22px;padding:22px;box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.07)}
    h1{font-size:22px;margin:0 0 8px}p{font-size:14px;line-height:1.45;color:#6e6e73;margin:0}.ok{color:#238636}.bad{color:#d92d20}
    .bar{height:6px;background:#e8e8ed;border-radius:999px;overflow:hidden;margin:18px 0}.bar span{display:block;height:100%;width:18%;background:#7d5cff;border-radius:inherit;animation:move .9s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(430%)}}
    .actions{display:grid;gap:9px;margin-top:16px}.actions a{text-decoration:none;text-align:center;padding:12px 14px;border-radius:13px;background:#111114;color:#fff;font-size:14px;font-weight:600}.actions a.secondary{background:#ececf1;color:#111114}
    @media(prefers-color-scheme:dark){html,body{background:#111114;color:#f7f7f8}section{background:#1c1c1e;box-shadow:none}p{color:#a1a1a6}.bar{background:#2c2c2e}.actions a{background:#f2f2f4;color:#111114}.actions a.secondary{background:#2c2c2e;color:#f7f7f8}}
  </style>

  <!-- rm-environment-icon -->
  <link rel="icon" href="./icon-beta.jpeg?v=20260911" type="image/jpeg">
  <link rel="apple-touch-icon" href="./icon-beta.jpeg?v=20260911">
</head>
<body>
<main><section>
  <h1>Recuperando o Registro</h1>
  <p id="status">Removendo somente o cache e o Service Worker da interface. IndexedDB e localStorage não serão apagados.</p>
  <div class="bar" id="bar"><span></span></div>
  <div class="actions" id="actions" hidden>
    <a href="./launch.html?v=1.2.0-beta.42&recover=1">Abrir o app novamente</a>
    <a class="secondary" href="./safe.html?v=1.2.0-beta.42&recover=1">Abrir modo seguro</a>
  </div>
</section></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const actions=document.getElementById('actions');
  const bar=document.getElementById('bar');
  try{
    let workers=0,cachesRemoved=0;
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      const targets=regs.filter(r=>String(r.scope||'').includes('/Registro-mental-v1/beta/'));
      const results=await Promise.allSettled(targets.map(r=>r.unregister()));
      workers=results.filter(r=>r.status==='fulfilled'&&r.value).length;
    }
    if('caches' in window){
      const keys=await caches.keys();
      const targets=keys.filter(k=>k.startsWith('registro-beta-v1-'));
      const results=await Promise.allSettled(targets.map(k=>caches.delete(k)));
      cachesRemoved=results.filter(r=>r.status==='fulfilled'&&r.value).length;
    }
    status.className='ok';
    status.textContent=`Interface recuperada: ${workers} Service Worker(s) removido(s), ${cachesRemoved} cache(s) removido(s). Seus dados locais foram preservados.`;
    bar.hidden=true;
    actions.hidden=false;
    try{localStorage.setItem('registro-beta-v1-last-recovery',new Date().toISOString())}catch(_){}
    setTimeout(()=>location.replace(`./launch.html?v=1.2.0-beta.42&recover=${Date.now()}`),900);
  }catch(err){
    status.className='bad';
    status.textContent='A limpeza automática não terminou. Seus registros não foram apagados. Você ainda pode abrir o modo seguro.';
    bar.hidden=true;
    actions.hidden=false;
  }
})();
</script>
</body>
</html>
